<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>한나노텍 비품 관리</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007DBD">

  <!--
    왜 이 껍데기가 있나
    ──────────────────
    앱 주소(script.google.com/…/exec)를 바로 열면 그 페이지는 구글이 만든다.
    구글 페이지가 우리 HTML 을 googleusercontent iframe 으로 품는데,
    그 iframe 이 보통 흐름에 height:100% 로 놓여 있다.

    홈 화면 앱(standalone)에서는 그 높이가 실제로 보이는 높이와 어긋난다
    (주소창이 없고 안전영역이 다르다). iOS 가 그 틈을 맞추려고 iframe 을
    통째로 한 겹 더 그려서 늘리는데, 늘린 그림이라 글자가 번진다.
    색이나 blur 문제가 아니다.

    그 CSS 는 구글 페이지에 있어 우리가 고칠 수 없다. 그래서 래퍼를 우리 것으로
    바꾸고, iframe 을 position:fixed 로 화면에 그대로 붙인다. 늘릴 일이 없어진다.

    앱 쪽은 doGet 이 XFrameOptionsMode.ALLOWALL 이어야 이 안에 들어온다.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- default 로 둔다. black-translucent 면 페이지가 상태표시줄 뒤까지 올라가는데, 아이폰 홈 화면 앱은
       그 윗부분(맨 위 ~90pt)을 흐리게 덮는다 — 상단바의 회사명·이름·아이콘만 번졌다.
       CSS 를 같게 만든 복제 줄은 아래로 내리면 선명했다(2026-09-14 판정판).
       또 innerHeight 가 상태표시줄만큼 짧게 와(ih 793 / scr 852) 맨 아래에 파란 띠가 남았다.
       취업관리시스템 pwa/index.html 이 default 로 흐림 없이 돌고 있다. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="비품 관리">

  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

  <style>
    /* 핵심 두 줄. 바깥은 스크롤을 두지 않고, iframe 을 화면에 그대로 붙인다.
       실제 스크롤은 앱 안쪽이 맡는다. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #007DBD; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }


    /* 구글 쪽이 깨어나는 데 몇 초 걸린다. 흰 화면만 있으면 고장 난 줄 안다.
       iframe 이 fixed 라 쌓임 순서가 바뀐다 — 덮개는 그보다 위에 둔다. */
    #boot { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
            background: #007DBD; color: rgba(255,255,255,.9);
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            font-size: 14px; transition: opacity .25s; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .mark { font-size: 56px; font-weight: 800; letter-spacing: -.04em; color: #fff; line-height: 1; }
    #boot .sp { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.35);
                border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body>

<div id="boot">
  <div class="mark">H</div>
  <div class="sp"></div>
  <div id="bootMsg">불러오는 중…</div>
</div>

<iframe id="app" title="비품 관리 시스템" allow="clipboard-read; clipboard-write"></iframe>

<script>
  // 사람들이 쓰는 배포 주소. clasp push 뒤 deploy -i 로 같은 id 의 버전만 올린다.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz-CEjZ9K773OzH4H5SdkQGRlJWfwCloLU4KmQP8LZtfK5pcIFR8WmhixvXuRjTaTa2/exec';

  var q = new URLSearchParams(location.search || '');

  // 이 껍데기 주소를 앱에 알려 준다. 스캐너에 다녀올 때 여기로 돌아와야
  // 상단이 다시 구글 페이지가 되지 않는다.
  q.set('wrap', location.origin + location.pathname);

  var f = document.getElementById('app');
  var booted = false;

  function bootDone() {
    if (booted) return;
    booted = true;
    var b = document.getElementById('boot');
    if (b) { b.classList.add('gone'); setTimeout(function () { b.remove(); }, 300); }
  }

  /* ---------- 앱이 안 뜰 때: 쿠키 없이 다시 연다 ----------
     크롬에 구글 계정이 여러 개 로그인돼 있으면 /macros/s/ 주소가 엉뚱한 계정으로 붙어
     구글이 "현재 파일을 열 수 없습니다" 를 대신 그린다. 시크릿 창에서는 열린다 — 앱 문제가 아니다.

     예전에는 15초·24초에 authuser=0/1 로 바꿔 보고 33초에 실패 안내를 띄웠다. 계정 순서에 따라
     둘 다 틀려서 30초 넘게 기다린 끝에 실패만 봤다(2026-09-14, PC 크롬).

     이제는 **credentialless iframe**(쿠키를 안 보냄 = 시크릿 창과 같은 상태)으로 한 번 더 연다.
     앱은 익명 공개 배포라 로그인 없이 뜬다. 판정도 빠르게 한다 — 앱은 스크립트가 돌자마자
     bipum-alive 를 보내므로, 구글 페이지 load 뒤 3초 안에 그것이 없으면 실패로 본다.

     대가: credentialless 안의 저장소는 창을 닫으면 지워져 **매번 로그인**해야 한다. 그래서 처음부터
     쓰지 않고 실패했을 때만 쓴다. 한 번 필요했던 브라우저는 7일간 기억해 곧바로 그 길로 연다. */
  var CL_KEY = 'bipumCredentialless';
  var clSupported = 'credentialless' in HTMLIFrameElement.prototype;
  var attempt = 0, alive = false, usedCl = false, startedAt = 0;

  function clRemembered() {
    try { var v = Number(localStorage.getItem(CL_KEY)); return v > 0 && Date.now() - v < 7 * 864e5; }
    catch (err) { return false; }
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://script.google.com' &&
        e.origin.indexOf('.googleusercontent.com') < 0) return;
    var type = e && e.data && e.data.type;
    if (type === 'bipum-alive' || type === 'bipum-ready') alive = true;
    if (type === 'bipum-alive' && e.ports && e.ports[0]) linkApp(e.ports[0]);
    if (type === 'bipum-ready') {
      // 쿠키 없이 **빨리** 떴을 때만 기억한다. 느리게 떴다면 첫 시도도 그저 느렸던 것일 수 있다 —
      // 잘못 기억하면 7일 동안 매번 로그인해야 한다.
      if (usedCl && Date.now() - startedAt < 8000) { try { localStorage.setItem(CL_KEY, String(Date.now())); } catch (err) {} }
      bootDone();
    }
  });

  /* ---------- 스캐너를 이 페이지 위에 겹쳐 띄운다 ----------
     예전에는 앱이 top 을 scan.html 로 옮겼다가 ?qr= 로 돌아왔다. 돌아올 때마다 이 래퍼가 앱을
     처음부터 다시 불러, 파란 로딩 화면이 3~6초 떴다(2026-09-14).
     이 페이지는 top-level 이라 카메라를 쓸 수 있다. scan.html 을 iframe 으로 겹쳐 열고, 읽은 코드만
     앱에 건넨다. 앱 문서는 구글 iframe 두 겹 안이라 직접 닿지 않으므로, 앱이 bipum-alive 에 실어
     보낸 MessagePort 로 주고받는다. 이 포트가 없는 옛 앱은 예전 길(밖 스캐너)을 그대로 쓴다. */
  var appPort = null, scanFrame = null;

  function linkApp(port) {
    appPort = port;
    port.onmessage = function (ev) {
      var d = ev.data || {};
      if (d.type === 'scan') openScan(d.kind);
    };
    port.postMessage({ type: 'caps', scan: true });
  }

  function openScan(kind) {
    closeScan();
    scanFrame = document.createElement('iframe');
    scanFrame.setAttribute('allow', 'camera');
    scanFrame.title = 'QR 스캔';
    scanFrame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:20;background:#000';
    scanFrame.src = 'scan.html?embed=1&kind=' + encodeURIComponent(kind || '');
    document.body.appendChild(scanFrame);
  }

  function closeScan() {
    if (scanFrame) { scanFrame.remove(); scanFrame = null; }
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !scanFrame || e.source !== scanFrame.contentWindow) return;
    var d = e.data || {};
    if (d.type === 'ems-scan') {
      closeScan();
      if (appPort) appPort.postMessage({ type: 'scan-result', code: String(d.code || '') });
    } else if (d.type === 'ems-scan-cancel') {
      closeScan();
      if (appPort) appPort.postMessage({ type: 'scan-cancel' });
    }
  });

  var msg = document.getElementById('bootMsg');
  function tell(t) { if (msg && !booted) msg.textContent = t; }

  var baseSrc = APP_URL + '?' + q.toString();

  function openApp(cl) {
    var my = ++attempt;
    alive = false;
    usedCl = cl;
    var n = document.createElement('iframe');
    n.id = 'app';
    n.title = f.title;
    n.setAttribute('allow', f.getAttribute('allow') || '');
    if (cl) n.setAttribute('credentialless', '');
    // load 는 구글 바깥 페이지가 뜬 것이고, 우리 앱 문서는 그 뒤에 구글 스크립트가 붙인다(doGet 3~6초).
    // 처음에 load + 3초로 판정했더니 로그인 없는 창에서도 늘 실패로 봤다. 넉넉히 12초를 준다. (2026-09-14)
    n.addEventListener('load', function () {
      setTimeout(function () { if (my === attempt && !alive) failed(); }, 12000);
    });
    startedAt = Date.now();
    f.parentNode.replaceChild(n, f);
    f = n;
    f.src = baseSrc;
    // load 조차 안 오는 경우(망이 느리거나 막힘)
    setTimeout(function () { if (my === attempt && !alive) failed(); }, 25000);
    setTimeout(function () { if (my === attempt) tell('구글 서버를 깨우는 중입니다…'); }, 4000);
    setTimeout(function () { if (my === attempt) tell('조금만 더 기다려 주세요…'); }, 10000);
  }

  function failed() {
    if (booted) return;
    if (!usedCl && clSupported) {
      tell('다시 여는 중입니다…');
      return openApp(true);
    }
    try { localStorage.removeItem(CL_KEY); } catch (err) {}
    showFail();
  }

  function showFail() {
    var b = document.getElementById('boot');
    if (!b) return;
    b.innerHTML =
      '<div class="mark">H</div>' +
      '<div style="max-width:22em;line-height:1.7;text-align:center;padding:0 24px">' +
      '<b>앱을 여는 데 실패했습니다.</b><br>' +
      '이 브라우저에 구글 계정이 여러 개 로그인돼 있으면 생기는 일입니다. ' +
      '아래로 열거나, 시크릿 창에서 열어 보세요.</div>' +
      '<a id="direct" style="display:inline-block;margin-top:4px;padding:13px 22px;border-radius:12px;' +
      'background:#fff;color:#007DBD;font-weight:700;text-decoration:none">새 탭에서 바로 열기</a>' +
      '<a id="again" style="margin-top:2px;color:rgba(255,255,255,.85);font-size:13px;text-decoration:underline">다시 시도</a>';
    var d = document.getElementById('direct');
    if (d) { d.href = baseSrc; d.target = '_blank'; d.rel = 'noopener'; }
    var a = document.getElementById('again');
    if (a) a.onclick = function () { location.reload(); };
  }

  openApp(clSupported && clRemembered());

  // 주소에 실려 온 표(t)·QR 값은 앱에 넘긴 뒤 지운다.
  // 홈 화면 아이콘은 '추가' 하는 순간의 주소가 굳으므로, 지금 아이콘을 만들어도
  // 옛 표가 함께 굳지 않게 한다.
  if (q.get('t') || q.get('qr')) {
    try { history.replaceState(null, '', location.pathname); } catch (err) {}
  }
</script>
</body>
</html>
